<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#A61E57" />
    <title>Offline — MNM Fashion</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #FBF8FA; color: #2A1E2B; padding: 24px;
      }
      .card {
        max-width: 420px; text-align: center; background: #fff; border: 1px solid #f0e4ea;
        border-radius: 16px; padding: 32px 24px; box-shadow: 0 10px 30px rgba(166,30,87,0.08);
      }
      .logo {
        width: 64px; height: 64px; border-radius: 16px; background: #A61E57; color: #fff;
        display: grid; place-items: center; font-weight: 700; font-size: 32px; margin: 0 auto 16px;
        box-shadow: inset 0 0 0 2px rgba(200,151,47,0.45);
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #6b7280; line-height: 1.5; margin: 0 0 20px; }
      button {
        background: #A61E57; color: #fff; border: 0; border-radius: 10px;
        padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer;
      }
      .hint { margin-top: 16px; font-size: 13px; color: #9ca3af; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">M</div>
      <h1>You're offline</h1>
      <p>
        MNM Fashion can't reach the server right now. Billing and stock updates need an
        internet connection to keep inventory accurate.
      </p>
      <button onclick="location.reload()">Try again</button>
      <div class="hint">Your installed app shell still works — reconnect to continue.</div>
    </div>
  </body>
</html>
